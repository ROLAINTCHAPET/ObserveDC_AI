# Collecteur de périphérie (D16). Modèle à adapter au PoC de protocoles (hypothèse H5) :
# chaque entrée doit porter le tag « equipment » = code de l'équipement enregistré.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# Sortie : API d'ingestion, avec la clé de la source « carte physique »
[[outputs.http]]
  url = "http://ingestion:8000/ingest/telegraf"
  data_format = "json"
  json_timestamp_units = "1s"
  [outputs.http.headers]
    X-Source-Key = "${CARD_SOURCE_KEY}"
    Content-Type = "application/json"

